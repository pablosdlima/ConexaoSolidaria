# Solução completa: infraestrutura + os dois microsserviços.
# É este arquivo que o README manda rodar para a correção.
#
#   docker compose up -d                  → só a infraestrutura
#   docker compose --profile app up -d    → infraestrutura + API + Worker (a partir da Fase 5)
#   docker compose --profile app --profile front up -d → + front Blazor (experimental, :5100)
#
#   API Gateway:   http://localhost:5000  (entrada unica: /api/...)
#   CampanhasAPI:  http://localhost:5001/swagger
#   DoacoesWorker: http://localhost:5002/publico/campanhas
#   RabbitMQ UI:   http://localhost:15672   (dev / dev)
#   PostgreSQL:    localhost:5432           (dev / dev)
#   MongoDB:       localhost:27017          (dev / dev)

services:

  # ─── INFRAESTRUTURA ───────────────────────────────────────

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: dev
      RABBITMQ_DEFAULT_PASS: dev
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: campanhas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d campanhas"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mongo:
    image: mongo:8
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: dev
      MONGO_INITDB_ROOT_PASSWORD: dev
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mongo-data:/data/db

  # ─── MICROSSERVIÇOS (profile "app" — precisam dos dockerfiles da Fase 5) ───

  campanhas-api:
    profiles: ["app"]
    build:
      context: ../CampanhasAPI
      dockerfile: dockerfile
    image: conexao-solidaria/campanhas-api:${IMAGE_TAG:-local}
    container_name: campanhas-api
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      ASPNETCORE_URLS: http://+:5001   # mesma porta do Service no Kubernetes
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Key: "compose-dev-key-troque-no-kubernetes-via-secret-0123456789"
      ConnectionStrings__Campanhas: "Host=postgres;Database=campanhas;Username=dev;Password=dev"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: dev
      RabbitMQ__Password: dev
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  doacoes-worker:
    profiles: ["app"]
    build:
      context: ../DoacoesWorker
      dockerfile: dockerfile
    image: conexao-solidaria/doacoes-worker:${IMAGE_TAG:-local}
    container_name: doacoes-worker
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      ASPNETCORE_URLS: http://+:5002
      ASPNETCORE_ENVIRONMENT: Development
      MongoDB__ConnectionString: "mongodb://dev:dev@mongo:27017"
      MongoDB__DatabaseName: doacoes
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: dev
      RabbitMQ__Password: dev
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy


  api-gateway:
    profiles: ["app"]
    build:
      context: ../ApiGateway
      dockerfile: dockerfile
    image: conexao-solidaria/api-gateway:${IMAGE_TAG:-local}
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_URLS: http://+:5000
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      - campanhas-api
      - doacoes-worker

  # ─── FRONT EXPERIMENTAL (fora do escopo do MVP) ───────────
  # docker compose --profile app --profile front up -d --build  → http://localhost:5100

  webapp:
    profiles: ["front"]
    build:
      context: ../WebApp
      dockerfile: dockerfile
    image: conexao-solidaria/webapp:${IMAGE_TAG:-local}
    container_name: webapp
    restart: unless-stopped
    ports:
      - "5100:5100"
    environment:
      ASPNETCORE_URLS: http://+:5100
      ASPNETCORE_ENVIRONMENT: Production
      # Modo Auto: o 1º acesso roda NO SERVIDOR (dentro do container), onde localhost
      # é o próprio container. O WebAssembly no navegador segue usando
      # wwwroot/appsettings.json → http://localhost:5000.
      Api__BaseUrl: http://api-gateway:5000
    depends_on:
      - api-gateway

volumes:
  postgres-data:
  mongo-data:
