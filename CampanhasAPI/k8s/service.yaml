# LoadBalancer: no Docker Desktop (e em nuvem) ganha IP externo — aqui, localhost:5001.
# NodePort nao e encaminhado para o localhost no Kubernetes baseado em kind do Docker Desktop.
apiVersion: v1
kind: Service
metadata:
  name: campanhas-api
spec:
  selector:
    app: campanhas-api
  type: LoadBalancer
  ports:
    - port: 5001        # Swagger: http://localhost:5001/swagger
      targetPort: 8080
